apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-test-script
data:
  keycloak-login-test.js: |
    // keycloak-login-test.js
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Counter, Rate, Trend } from 'k6/metrics';
    import { SharedArray } from 'k6/data';

    // ── Config ─────────────────────────────────────────────────────
    const KEYCLOAK_URL  = __ENV.KEYCLOAK_URL  || 'http://keycloak-service.test.svc.cluster.local:8080';
    const KEYCLOAK_URL_HEALTH = __ENV.KEYCLOAK_URL_HEALTH || 'http://keycloak-service.test.svc.cluster.local:9000';
    const REALM         = __ENV.REALM         || 'test';
    const CLIENT_ID     = __ENV.CLIENT_ID     || 'test-client';
    const TOTAL_USERS   = parseInt(__ENV.TOTAL_USERS || '100');
    const VIRTUAL_USERS = parseInt(__ENV.VIRTUAL_USERS || '2');

    // ── สร้าง User List แบบ Shared (ทุก VUser ใช้ list เดียวกัน) ──
    // ใช้ SharedArray เพื่อไม่ต้องสร้าง array ซ้ำทุก VUser
    const users = new SharedArray('users', function() {
      // สร้าง array ของ user index แบบ shuffle (ไม่ซ้ำ)
      const arr = Array.from({ length: TOTAL_USERS }, (_, i) => i + 1);

      // Fisher-Yates Shuffle
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    });

    // ── K6 Options ─────────────────────────────────────────────────
    export const options = {
      vus: VIRTUAL_USERS,          // 10 virtual users
      iterations: TOTAL_USERS,     // รวม 100,000 iterations (แต่ละ VUser รับส่วนของตัวเอง)

      // หรือใช้ duration แทน
      // duration: '30m',

      // Tag สำหรับ output
      tags: {
        environment: 'openshift',
        test: 'keycloak-login',
        realm: REALM,
      },
    };

    // ── State สำหรับ track user ที่ใช้ไปแล้ว (per VUser) ──────────
    let userIndex = 0;

    // ── Setup: ตรวจสอบ Keycloak พร้อม ─────────────────────────────
    export function setup() {
      console.log(`Starting load test against: ${KEYCLOAK_URL}`);
      console.log(`Realm: ${REALM}, Total Users: ${TOTAL_USERS}, VUsers: ${VIRTUAL_USERS}`);

      // Health check
      const health = http.get(`${KEYCLOAK_URL_HEALTH}/health/ready`);
      check(health, {
        'keycloak is ready': (r) => r.status === 200,
      });

      if (health.status !== 200) {
        throw new Error(`Keycloak not ready: ${health.status}`);
      }

      console.log('Keycloak is ready ✓');
      return { startTime: new Date().toISOString() };
    }

    // ── Main Test Function ──────────────────────────────────────────
    export default function(data) {
      // คำนวณ user index สำหรับ VUser นี้
      // ทำให้แต่ละ iteration ใช้ user ที่แตกต่างกัน
      const iterationIndex = __ITER + (__VU - 1) * Math.ceil(TOTAL_USERS / VIRTUAL_USERS);
      const idx = iterationIndex % TOTAL_USERS;
      const userNum = users[idx];

      const username = `user${userNum}`;
      const password = `user${userNum}-password`;

      // ── Login Request ───────────────────────────────────────────
      const loginUrl = `${KEYCLOAK_URL}/realms/${REALM}/protocol/openid-connect/token`;

      const params = {
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        tags: {
          name: 'keycloak_login',
        },
      };

      const payload = {
        grant_type: 'password',
        client_id:  CLIENT_ID,
        username:   username,
        password:   password,
        scope:      'openid',
      };

      const response = http.post(loginUrl, payload, params);

      const success = check(response, {
        'login status 200':  (r) => r.status === 200,
        'has access_token':  (r) => {
          try {
            const body = JSON.parse(r.body);
            return body.access_token !== undefined;
          } catch {
            return false;
          }
        },
      });
    }

