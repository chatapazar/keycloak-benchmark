apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
spec:
  additionalOptions:
    - name: enable-recovery
      value: 'true'
  db:
    database: keycloak
    host: keycloak-pgsql
    passwordSecret:
      key: password
      name: keycloak-pgsql-user
    usernameSecret:
      key: user
      name: keycloak-pgsql-user
    vendor: postgres
  hostname:
    hostname: sso-test.apps.ocp.rtdph.sandbox3400.opentlc.com
    strict: false
    strictBackchannel: false
  http:
    httpEnabled: false
    tlsSecret: keycloak-tls
  ingress:
    enabled: false
  instances: 2
  transaction:
    xaEnabled: true
